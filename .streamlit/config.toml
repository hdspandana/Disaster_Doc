# DisasterDoc Streamlit configuration.
# Keep browser-origin protections enabled when serving through a reverse proxy. Configure
# the proxy to forward the host/origin correctly rather than disabling XSRF for convenience.
[server]
address = "0.0.0.0"
port = 8501
headless = true
enableCORS = true
enableXsrfProtection = true
maxUploadSize = 25

[browser]
gatherUsageStats = false

[theme]
base = "light"
primaryColor = "#17395C"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F6F8FA"
textColor = "#1B2430"
font = "sans serif"

[client]
showErrorDetails = false
toolbarMode = "minimal"
