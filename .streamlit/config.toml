# DisasterDoc Streamlit configuration.
# enableCORS/XSRF are disabled so the app can be served behind a reverse proxy
# (e.g. a hosted preview or an internal demo link). This app holds no user accounts
# and no persisted data, so there is no session state worth protecting with XSRF tokens.
[server]
address = "0.0.0.0"
port = 8501
headless = true
enableCORS = false
enableXsrfProtection = false
maxUploadSize = 25

[browser]
gatherUsageStats = false

[theme]
base = "light"
primaryColor = "#17395C"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F6F8FA"
textColor = "#1B2430"
font = "sans serif"

[client]
showErrorDetails = true
toolbarMode = "minimal"
